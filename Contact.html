    <!-- =================================================
         CONTACT PAGE
    ================================================== -->

    <main class="contact-page">

        <!-- Background decoration -->
        <div class="glow glow-purple"></div>
        <div class="glow glow-orange"></div>


        <!-- =================================================
             HERO
        ================================================== -->

        <section class="contact-hero">

            <span class="hero-small-title">
                CONTACT
            </span>

            <h1>
                Get in <span>touch</span>
            </h1>

            <p>
                Let’s build something awesome.
            </p>

        </section>


        <!-- =================================================
             CONTACT CONTENT
        ================================================== -->

        <section class="contact-content">

            <!-- =================================================
                 MESSAGE WINDOW
            ================================================== -->

            <div class="message-window">

                <!-- Window header -->
                <div class="message-header">

                    <div class="window-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <div class="window-title">
                        New message
                    </div>

                    <div class="window-right-icon">
                        <i class="fa-regular fa-envelope"></i>
                    </div>

                </div>


                <!-- Form -->
                <form class="message-form">

                    <!-- Email -->
                    <div class="form-row">

                        <label for="email">
                            Email:
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            required
                        >

                    </div>


                    <!-- Name -->
                    <div class="form-row">

                        <label for="name">
                            Name:
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your name"
                            required
                        >

                    </div>


                    <!-- Subject -->
                    <div class="form-row">

                        <label for="subject">
                            Subject:
                        </label>

                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            placeholder="Enter subject"
                            required
                        >

                    </div>


                    <!-- Message -->
                    <textarea
                        id="message"
                        name="message"
                        placeholder="Write your message here..."
                        required
                    ></textarea>


                    <!-- Send -->
                    <div class="send-area">

                        <span class="send-note">
                            I usually reply within 24 hours.
                        </span>

                        <button type="submit">
                            Send
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>

                    </div>

                </form>

            </div>


            <!-- =================================================
                 SOCIAL LINKS
            ================================================== -->

            <div class="contact-socials">

                <a
                    href="mailto:your@email.com"
                    aria-label="Email"
                >
                    <i class="fa-solid fa-envelope"></i>
                </a>

               
                <a
                    href="https://www.linkedin.com/in/arya-azizi-8b6535364"
                    aria-label="LinkedIn"

                    aria-label="GitHub"
                >
                    <i class="fa-brands fa-github"></i>
                </a>
                
                <a
                    href="https://www.instagram.com/itsari884?igsi=MWxvaGs0a25sYTNtbg=="
                    aria-label="Instagram"
                >
                    <i class="fa-brands fa-instagram"></i>
                </a>

               

            </div>
